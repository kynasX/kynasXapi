    <style>
        /* Cosmic Theme Background */
        body {
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
            background: #000428;  /* fallback for old browsers */
            background: -webkit-linear-gradient(to bottom, #000428, #004e92);  /* Chrome 10-25, Safari 5.1-6 */
            background: linear-gradient(to bottom, #000428, #004e92); /* W3C, IE 10+/ Edge, Firefox 16+, Chrome 26+, Opera 12+, Safari 7+ */
        }
        
        .cosmic-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(103, 58, 183, 0.3) 0%, transparent 40%),
                radial-gradient(ellipse at 80% 80%, rgba(33, 150, 243, 0.2) 0%, transparent 40%),
                radial-gradient(ellipse at 40% 60%, rgba(156, 39, 176, 0.2) 0%, transparent 40%);
            opacity: 0.8;
        }
        
        /* Stars Container */
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        
        /* Stars Layers */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #ddd, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 130px 80px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, #eee, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: starsShift 60s linear infinite;
        }
        
        .stars2 {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(1px 1px at 50px 160px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 200px, #eee, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 150px 100px, #ddd, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 190px 50px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 230px 150px, #eee, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 250px 250px;
            animation: starsShift 80s linear infinite reverse;
            opacity: 0.7;
        }
        
        .stars3 {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(1px 1px at 10px 10px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 100px 150px, #eee, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 200px 50px, #ddd, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 250px 100px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 300px 200px, #eee, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 300px 300px;
            animation: starsShift 100s linear infinite;
            opacity: 0.5;
        }
        
        @keyframes starsShift {
            from {
                background-position: 0 0;
            }
            to {
                background-position: 300px 300px;
            }
        }
        
        /* Shooting Stars */
        .shooting-star {
            position: absolute;
            top: 0;
            left: 0;
            width: 2px;
            height: 100px;
            background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.8), transparent);
            border-radius: 50%;
            animation: shooting 5s linear infinite;
            opacity: 0;
            transform: rotate(45deg);
        }
        
        @keyframes shooting {
            0% {
                opacity: 0;
                transform: translate(0, 0) rotate(45deg);
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translate(500px, 500px) rotate(45deg);
            }
        }
        
        /* Planets */
        .planet {
            position: fixed;
            border-radius: 50%;
            z-index: -1;
            filter: blur(1px);
        }
        
        .planet-1 {
            width: 150px;
            height: 150px;
            top: 15%;
            right: 10%;
            background: radial-gradient(circle at 30% 30%, #673ab7, #512da8, #311b92);
            box-shadow: 0 0 50px rgba(103, 58, 183, 0.3);
            animation: floatPlanet 40s ease-in-out infinite;
        }
        
        .planet-2 {
            width: 80px;
            height: 80px;
            bottom: 20%;
            left: 5%;
            background: radial-gradient(circle at 40% 40%, #2196f3, #1976d2, #0d47a1);
            box-shadow: 0 0 30px rgba(33, 150, 243, 0.3);
            animation: floatPlanet 50s ease-in-out infinite reverse;
        }
        
        .planet-3 {
            width: 60px;
            height: 60px;
            top: 70%;
            right: 15%;
            background: radial-gradient(circle at 50% 50%, #9c27b0, #7b1fa2, #4a148c);
            box-shadow: 0 0 25px rgba(156, 39, 176, 0.3);
            animation: floatPlanet 35s ease-in-out infinite;
        }
        
        @keyframes floatPlanet {
            0%, 100% {
                transform: translate(0, 0);
            }
            25% {
                transform: translate(20px, -20px);
            }
            50% {
                transform: translate(0, -40px);
            }
            75% {
                transform: translate(-20px, -20px);
            }
        }
        
        /* Nebula Clouds */
        .nebula {
            position: fixed;
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.3;
            z-index: -1;
        }
        
        .nebula-1 {
            width: 300px;
            height: 300px;
            top: 10%;
            left: 5%;
            background: radial-gradient(circle, rgba(103, 58, 183, 0.4), transparent 70%);
            animation: nebulaFloat 50s ease-in-out infinite;
        }
        
        .nebula-2 {
            width: 400px;
            height: 400px;
            bottom: 10%;
            right: 5%;
            background: radial-gradient(circle, rgba(33, 150, 243, 0.3), transparent 70%);
            animation: nebulaFloat 60s ease-in-out infinite reverse;
        }
        
        @keyframes nebulaFloat {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(30px, -30px) scale(1.1);
            }
            66% {
                transform: translate(-20px, 20px) scale(0.9);
            }
        }
        
        /* Cosmic Dust */
        .cosmic-dust {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='1' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.1'/%3E%3C/svg%3E");
            opacity: 0.15;
            animation: dustMove 20s linear infinite;
        }
        
        @keyframes dustMove {
            0% {
                background-position: 0 0;
            }
            100% {
                background-position: 100px 100px;
            }
        }
        
        /* Light mode adjustments */
        .light .cosmic-bg {
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(187, 222, 251, 0.5) 0%, transparent 40%),
                radial-gradient(ellipse at 80% 80%, rgba(179, 229, 252, 0.4) 0%, transparent 40%),
                radial-gradient(ellipse at 40% 60%, rgba(225, 190, 231, 0.4) 0%, transparent 40%);
        }
        
        .light .planet-1 {
            background: radial-gradient(circle at 30% 30%, #bb86fc, #9a67ea, #7e57c2);
            box-shadow: 0 0 50px rgba(187, 134, 252, 0.3);
        }
        
        .light .planet-2 {
            background: radial-gradient(circle at 40% 40%, #82b1ff, #448aff, #2979ff);
            box-shadow: 0 0 30px rgba(130, 177, 255, 0.3);
        }
        
        .light .planet-3 {
            background: radial-gradient(circle at 50% 50%, #ea80fc, #e040fb, #d500f9);
            box-shadow: 0 0 25px rgba(234, 128, 252, 0.3);
        }
        
        .light .nebula-1 {
            background: radial-gradient(circle, rgba(187, 134, 252, 0.3), transparent 70%);
        }
        
        .light .nebula-2 {
            background: radial-gradient(circle, rgba(130, 177, 255, 0.2), transparent 70%);
        }
        
        /* Glass effect enhancement for cosmic theme */
        .glass {
            backdrop-filter: blur(16px) saturate(180%);
            background: rgba(10, 15, 35, 0.75);
            border: 1px solid rgba(103, 58, 183, 0.2);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        
        .light .glass {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(187, 134, 252, 0.2);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.5);
        }
        
        .loader {
            width: 28px;
            height: 28px;
            border: 2px solid #4a5568;
            border-top: 2px solid #e2e8f0;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #8a2be2 0%, #4169e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .btn-gradient {
            background: linear-gradient(135deg, #8a2be2 0%, #4169e1 100%);
            transition: all 0.3s ease;
        }
        
        .btn-gradient:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 25px -5px rgba(138, 43, 226, 0.4);
        }
        
        .method-get {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }
        
        .method-post {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
        }
        
        .status-ready {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        
        .status-update {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        
        .status-error {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        
        .blink {
            animation: blink 2s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* Transition for expand/collapse */
        .expand-transition {
            transition: all 0.3s ease;
        }
        
        /* Copy button styles */
        .copy-btn {
            transition: all 0.2s ease;
        }
        
        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
                        
        
        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 80px;
            right: 20px;
            background: rgba(10, 15, 35, 0.9);
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 0.80rem;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
            backdrop-filter: blur(10px);
            max-width: 300px;
        }
        
        .light .toast {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(187, 134, 252, 0.3);
            color: #1e293b;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        /* Light mode styles */
        .light {
            background: #e6f7ff;
            color: #1e293b;
        }
        
        .light .glass {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(0, 0, 0, 0.125);
        }
        
        .light .loader {
            border: 2px solid #cbd5e1;
            border-top: 2px solid #475569;
        }
        
        /* Media display styles */
        .response-media-container {
            min-height: 300px;
            max-height: 500px;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            width: 100%;
        }

        /* Video full size */
        .response-media-container video {
            width: 100%;
            height: 100%;
            max-height: 500px;
            object-fit: contain;
        }

        /* Image full size */
        .response-media-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* Audio player styling */
        .response-media-container audio {
            width: 100%;
            max-width: 400px;
        }

        /* Error display */
        .response-media-container .error-container {
            padding: 2rem;
            text-align: center;
        }
        
        /* Search highlight */
        .highlight {
            background-color: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
        }
        
        .charging {
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* Card hover effects */
        .stat-card {
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
        }
        
        .category-group {
            display: block !important;
        }
        
        .api-item {
            display: block !important;
        }
        
        .category-group[style*="display: none"],
        .category-group[style*="display:none"] {
            display: none !important;
        }
        
        .api-item[style*="display: none"],
        .api-item[style*="display:none"] {
            display: none !important;
        }
        
        .contact-customer {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 45px;
            height: 45px;

            background: linear-gradient(135deg, #8a2be2 0%, #4169e1 100%);

            transition: transform .3s ease, box-shadow .3s ease;
            animation: floatBtn 4s ease-in-out infinite;
        }
        
        .contact-customer:hover {
            transform: translateY(-8px) scale(1.08);
            box-shadow: 0 12px 28px rgba(138, 43, 226, 0.7);

        }
        
        .contact-customer svg {
            width: 26px;
            height: 26px;
        }
        
        @keyframes floatBtn {
            0%   { transform: translateY(0); }
            50%  { transform: translateY(-20px); }
            100% { transform: translateY(0); }
        }
        
        /* Input focus styles for cosmic theme */
        input:focus, textarea:focus, select:focus {
            border-color: #8a2be2 !important;
            box-shadow: 0 0 0 3px rgba(138, 43, 226, 0.2) !important;
        }
    </style>
</head>

    <script>
        // Create dynamic shooting stars
        function createShootingStars() {
            const container = document.querySelector('.stars-container');
            if (!container) return;
            
            // Remove existing shooting stars except the first few
            const existingStars = container.querySelectorAll('.shooting-star');
            if (existingStars.length > 3) {
                for (let i = 3; i < existingStars.length; i++) {
                    existingStars[i].remove();
                }
            }
            
            // Create new shooting stars randomly
            const starCount = Math.floor(Math.random() * 3) + 1; // 1-3 stars
            
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'shooting-star';
                
                // Random position
                const left = Math.random() * 100;
                const top = Math.random() * 100;
                
                // Random size and animation delay
                const height = Math.random() * 80 + 40; // 40-120px
                const delay = Math.random() * 10; // 0-10s delay
                const duration = Math.random() * 3 + 3; // 3-6s duration
                
                star.style.left = `${left}%`;
                star.style.top = `${top}%`;
                star.style.height = `${height}px`;
                star.style.animationDelay = `${delay}s`;
                star.style.animationDuration = `${duration}s`;
                
                container.appendChild(star);
                
                // Remove star after animation completes
                setTimeout(() => {
                    if (star.parentNode) {
                        star.remove();
                    }
                }, (duration + delay) * 1000);
            }
        }
        
        // Initialize cosmic effects
        document.addEventListener('DOMContentLoaded', function() {
            // Create initial shooting stars
            createShootingStars();
            
            // Schedule shooting stars creation at random intervals
            function scheduleShootingStar() {
                const delay = Math.random() * 5000 + 3000; // 3-8 seconds
                setTimeout(() => {
                    createShootingStars();
                    scheduleShootingStar();
                }, delay);
            }
            
            scheduleShootingStar();
            
            // Add subtle parallax effect on mouse move
            document.addEventListener('mousemove', function(e) {
                const planets = document.querySelectorAll('.planet');
                const mouseX = e.clientX / window.innerWidth;
                const mouseY = e.clientY / window.innerHeight;
                
                planets.forEach((planet, index) => {
                    const speed = 0.05 + (index * 0.02);
                    const x = (mouseX - 0.5) * speed * 100;
                    const y = (mouseY - 0.5) * speed * 100;
                    
                    planet.style.transform = `translate(${x}px, ${y}px)`;
                });
            });
        });
    </script>
    
    <script src="/script.js"></script>
</body>
</html>
