<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse through our collection of API endpoints. Find what you need or discover something new.">
    <meta name="theme-color" content="#0a0e17">
    <title>Kynas API - Cosmic Edition</title>
    <link rel="icon" href="/src/icon.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        'mono': ['Poppins', 'monospace'],
                        'sans': ['Inter', 'system-ui', 'sans-serif']
                    },
                    colors: {
                        cosmic: {
                            'primary': '#0a0e17',
                            'secondary': '#13182a',
                            'accent': '#1e253a',
                            'neon': '#00d4ff',
                            'purple': '#9d4edd',
                            'pink': '#ff2e63'
                        }
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-glow': 'pulse-glow 2s ease-in-out infinite',
                        'shimmer': 'shimmer 3s infinite linear',
                        'stars': 'stars 100s linear infinite'
                    },
                    keyframes: {
                        'float': { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } },
                        'pulse-glow': { '0%, 100%': { opacity: 1 }, '50%': { opacity: 0.7 } },
                        'shimmer': { '0%': { backgroundPosition: '-1000px 0' }, '100%': { backgroundPosition: '1000px 0' } },
                        'stars': { '0%': { transform: 'translateY(0) translateX(0)' }, '100%': { transform: 'translateY(-1000px) translateX(1000px)' } }
                    }
                }
            }
        }
    </script>

    <style>
        /* Cosmic Background & Star Animation */
        body {
            background-color: #0a0e17;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(29, 78, 216, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.1) 0%, transparent 20%);
            position: relative;
            overflow-x: hidden;
        }
        
        .stars {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, transparent),
                radial-gradient(2px 2px at 100px 150px, #fff, transparent),
                radial-gradient(1px 1px at 200px 100px, #ddd, transparent);
            background-repeat: repeat; background-size: 300px 300px; animation: stars 120s linear infinite;
        }

        /* Glassmorphism */
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px) saturate(180%); border: 1px solid rgba(255, 255, 255, 0.08); }
        .gradient-text { background: linear-gradient(135deg, #00d4ff 0%, #9d4edd 50%, #ff2e63 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        
        /* Custom Inputs for API Parameters */
        .param-input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 16px;
            color: #fff;
            font-size: 0.85rem;
            width: 100%;
            margin-bottom: 12px;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .param-input:focus {
            border-color: #00d4ff;
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.15);
        }

        .api-card { transition: all 0.4s ease; border: 1px solid rgba(255, 255, 255, 0.05); }
        .api-card:hover { transform: translateY(-6px); border-color: rgba(0, 212, 255, 0.3); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); }

        /* Toast Styling */
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9); border: 1px solid #00d4ff;
            padding: 12px 24px; border-radius: 50px; color: white;
            z-index: 9999; display: none; animation: slideUp 0.3s ease-out;
            backdrop-filter: blur(10px);
        }
        @keyframes slideUp { from { bottom: -50px; opacity: 0; } to { bottom: 30px; opacity: 1; } }

        .loader { width: 40px; height: 40px; border: 3px solid rgba(0, 212, 255, 0.1); border-top: 3px solid #00d4ff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .contact-customer { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, #00d4ff 0%, #9d4edd 100%); display: flex; align-items: center; justify-content: center; z-index: 50; cursor: pointer; box-shadow: 0 10px 30px rgba(0, 212, 255, 0.4); transition: 0.3s; }
        .contact-customer:hover { transform: scale(1.1) rotate(10deg); }
    </style>
</head>
<body class="text-slate-300 antialiased font-sans min-h-screen">
    <div class="stars"></div>
    
    <div id="toast" class="toast">
        <span id="toastMsg">Endpoint copied!</span>
    </div>

    <div id="loadingScreen" class="fixed inset-0 bg-cosmic-primary flex items-center justify-center z-[100]">
        <div class="text-center">
            <div class="loader mx-auto mb-6"></div>
            <h2 class="text-2xl font-bold gradient-text">Initializing Cosmos...</h2>
        </div>
    </div>

    <main class="max-w-6xl mx-auto px-4 md:px-8 py-12">
        <header class="text-center mb-16">
            <div class="flex flex-col items-center gap-6 mb-8">
                <div class="w-20 h-20 rounded-3xl bg-gradient-to-br from-cyan-400 to-purple-600 flex items-center justify-center shadow-2xl pulse-glow">
                    <i class="fas fa-rocket text-white text-3xl"></i>
                </div>
                <div>
                    <h1 id="titleApi" class="text-5xl md:text-6xl font-black gradient-text mb-4">Kynas API</h1>
                    <p id="descApi" class="text-slate-400 text-lg md:text-xl max-w-2xl mx-auto leading-relaxed">
                        High-performance API endpoints for modern developers. Secure, fast, and reliable.
                    </p>
                </div>
            </div>
            
            <div class="flex flex-wrap justify-center gap-6">
                <div class="glass px-8 py-4 rounded-3xl text-center min-w-[140px]">
                    <div class="text-3xl font-bold text-white mb-1">99.9%</div>
                    <div class="text-xs font-medium text-cyan-400 uppercase tracking-widest">Uptime</div>
                </div>
                <div class="glass px-8 py-4 rounded-3xl text-center min-w-[140px]">
                    <div id="endpointCount" class="text-3xl font-bold text-white mb-1">0</div>
                    <div class="text-xs font-medium text-purple-400 uppercase tracking-widest">Methods</div>
                </div>
                <div class="glass px-8 py-4 rounded-3xl text-center min-w-[140px]">
                    <div class="text-3xl font-bold text-white mb-1">JSON</div>
                    <div class="text-xs font-medium text-pink-400 uppercase tracking-widest">Format</div>
                </div>
            </div>
        </header>
        
        <section class="mb-12">
            <div class="glass rounded-3xl p-2 mb-8 flex items-center shadow-inner">
                <div class="relative flex-grow flex items-center">
                    <i class="fas fa-search absolute left-6 text-slate-500"></i>
                    <input type="text" id="searchInput" placeholder="Search for 'OrderKuota', 'Downloader'..." 
                           class="w-full pl-14 pr-6 py-5 bg-transparent text-white focus:outline-none text-lg">
                </div>
            </div>

            <div class="flex flex-col md:flex-row justify-between items-center gap-6">
                <div id="categoryTabs" class="flex flex-wrap gap-2">
                    <button onclick="filterCategory('All')" class="px-6 py-3 rounded-2xl glass hover:bg-white/10 transition-all font-semibold text-sm active border-cyan-500/50">All Endpoints</button>
                    </div>
            </div>
        </section>

        <section id="apiList" class="grid grid-cols-1 md:grid-cols-2 gap-8">
            </section>

        <div id="noResults" class="hidden text-center py-20">
            <i class="fas fa-ghost text-6xl text-slate-700 mb-4"></i>
            <h3 class="text-xl text-slate-500">No endpoints found matching your search.</h3>
        </div>

        <footer class="mt-24 pt-12 border-t border-slate-800/50 text-center">
            <div class="flex justify-center gap-8 text-2xl mb-8">
                <a id="telegramLink" target="_blank" class="text-slate-500 hover:text-cyan-400 transition-transform hover:scale-125"><i class="fab fa-telegram"></i></a>
                <a id="whatsappLink" target="_blank" class="text-slate-500 hover:text-green-400 transition-transform hover:scale-125"><i class="fab fa-whatsapp"></i></a>
                <a href="#" target="_blank" class="text-slate-500 hover:text-white transition-transform hover:scale-125"><i class="fab fa-github"></i></a>
            </div>
            <p id="footerText" class="text-slate-500 font-medium tracking-wide"></p>
            <p class="text-xs text-slate-600 mt-2 uppercase tracking-[0.2em]">Crafted with passion by Kynas Team</p>
        </footer>
    </main>

    <a id="contactCustomerBtn" href="#" target="_blank" class="contact-customer">
        <i class="fab fa-whatsapp text-white text-3xl"></i>
    </a>

    <script>
        let allEndpoints = [];

        // 1. Inisialisasi Data dari Backend
        async function init() {
            try {
                const response = await fetch('/settings');
                const data = await response.json();
                
                // Update Global UI
                document.getElementById('titleApi').innerText = data.name;
                document.getElementById('descApi').innerText = data.description;
                document.getElementById('telegramLink').href = data.linkTelegram;
                document.getElementById('whatsappLink').href = data.linkWhatsapp;
                document.getElementById('contactCustomerBtn').href = data.linkWhatsapp;
                document.getElementById('footerText').innerText = `© 2024 ${data.apiSettings.creator} • Built for Speed`;

                const categoryTabs = document.getElementById('categoryTabs');
                let total = 0;

                data.categories.forEach(cat => {
                    // Create Category Button
                    const btn = document.createElement('button');
                    btn.className = "px-6 py-3 rounded-2xl glass hover:bg-white/10 transition-all font-semibold text-sm";
                    btn.innerText = cat.name;
                    btn.onclick = (e) => {
                        // Toggle Active Class
                        document.querySelectorAll('#categoryTabs button').forEach(b => b.classList.remove('border-cyan-500/50'));
                        btn.classList.add('border-cyan-500/50');
                        filterCategory(cat.name);
                    };
                    categoryTabs.appendChild(btn);

                    // Add items to global list
                    cat.items.forEach(item => {
                        allEndpoints.push({ ...item, category: cat.name });
                        total++;
                    });
                });

                document.getElementById('endpointCount').innerText = total;
                renderEndpoints(allEndpoints);
                
                // Hide Loader
                setTimeout(() => {
                    document.getElementById('loadingScreen').style.opacity = '0';
                    setTimeout(() => document.getElementById('loadingScreen').classList.add('hidden'), 500);
                }, 800);

            } catch (err) {
                console.error("Critical Error:", err);
            }
        }

        // 2. Fungsi Render List API
        function renderEndpoints(endpoints) {
            const container = document.getElementById('apiList');
            const noResults = document.getElementById('noResults');
            container.innerHTML = '';

            if (endpoints.length === 0) {
                noResults.classList.remove('hidden');
                return;
            }
            noResults.classList.add('hidden');

            endpoints.forEach(item => {
                const card = document.createElement('div');
                card.className = "api-card glass p-8 rounded-[2rem] flex flex-col justify-between";
                
                // Parse Parameters (Misal dari innerDesc: "username, token")
                let paramsHtml = '';
                if (item.innerDesc) {
                    const params = item.innerDesc.split(',').map(p => p.trim());
                    params.forEach(p => {
                        paramsHtml += `
                            <div class="mb-4">
                                <label class="text-[10px] uppercase tracking-widest font-bold text-slate-500 ml-2 mb-2 block">${p}</label>
                                <input type="text" placeholder="Enter ${p}..." class="param-input" data-paramname="${p}">
                            </div>
                        `;
                    });
                }

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-center mb-6">
                            <span class="px-4 py-1.5 rounded-full bg-cyan-500/10 text-cyan-400 text-[10px] font-black uppercase tracking-widest border border-cyan-500/20">
                                ${item.category}
                            </span>
                            <div class="flex gap-2">
                                <button onclick="copyEndpoint('${item.path}')" class="w-10 h-10 rounded-xl bg-white/5 hover:bg-white/10 flex items-center justify-center transition-colors" title="Copy Path">
                                    <i class="far fa-copy text-slate-400"></i>
                                </button>
                                <span class="px-4 py-1.5 rounded-full bg-green-500/10 text-green-400 text-[10px] font-black uppercase tracking-widest">GET</span>
                            </div>
                        </div>
                        
                        <h3 class="text-2xl font-bold text-white mb-2 leading-tight">${item.name}</h3>
                        <p class="text-slate-400 text-sm mb-8 leading-relaxed">${item.desc}</p>
                        
                        <div class="api-params">
                            ${paramsHtml}
                        </div>
                    </div>

                    <div class="mt-8 flex gap-3">
                        <button onclick="executeApi(this, '${item.path}')" class="flex-grow py-4 bg-gradient-to-r from-cyan-500 to-purple-600 hover:from-cyan-400 hover:to-purple-500 text-white rounded-2xl font-bold text-sm shadow-xl transition-all active:scale-95 uppercase tracking-wider">
                            Test Endpoint
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 3. Logika Execute (Buka Tab Baru dengan Param)
        function executeApi(btn, path) {
            const card = btn.closest('.api-card');
            const inputs = card.querySelectorAll('.param-input');
            const url = new URL(window.location.origin + path);

            inputs.forEach(input => {
                const key = input.getAttribute('data-paramname');
                const val = input.value;
                if (val) url.searchParams.append(key, val);
            });

            window.open(url.toString(), '_blank');
        }

        // 4. Logika Copy Endpoint
        function copyEndpoint(path) {
            const fullUrl = window.location.origin + path;
            navigator.clipboard.writeText(fullUrl).then(() => {
                showToast("Endpoint URL Copied!");
            });
        }

        // 5. Toast Notification Logic
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 2500);
        }

        // 6. Filter & Search Logic
        function filterCategory(catName) {
            if (catName === 'All') {
                renderEndpoints(allEndpoints);
            } else {
                const filtered = allEndpoints.filter(i => i.category === catName);
                renderEndpoints(filtered);
            }
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase();
            const filtered = allEndpoints.filter(i => 
                i.name.toLowerCase().includes(q) || 
                i.desc.toLowerCase().includes(q) ||
                i.category.toLowerCase().includes(q)
            );
            renderEndpoints(filtered);
        });

        // Init on Load
        window.onload = init;
    </script>
</body>
</html>
