<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse through our collection of API endpoints. Find what you need or discover something new.">
    <meta name="theme-color" content="#0a0e17">
    <title>Kynas API</title>
    <link rel="icon" href="/src/icon.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        'mono': ['Poppins', 'monospace'],
                        'sans': ['Inter', 'system-ui', 'sans-serif']
                    },
                    fontSize: { 'xxs': ['0.65rem', { lineHeight: '0.9rem' }] },
                    colors: {
                        cosmic: {
                            'primary': '#0a0e17',
                            'secondary': '#13182a',
                            'accent': '#1e253a',
                            'neon': '#00d4ff',
                            'purple': '#9d4edd',
                            'pink': '#ff2e63'
                        }
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-glow': 'pulse-glow 2s ease-in-out infinite',
                        'shimmer': 'shimmer 3s infinite linear',
                        'stars': 'stars 100s linear infinite'
                    },
                    keyframes: {
                        'float': { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } },
                        'pulse-glow': { '0%, 100%': { opacity: 1 }, '50%': { opacity: 0.7 } },
                        'shimmer': { '0%': { backgroundPosition: '-1000px 0' }, '100%': { backgroundPosition: '1000px 0' } },
                        'stars': { '0%': { transform: 'translateY(0) translateX(0)' }, '100%': { transform: 'translateY(-1000px) translateX(1000px)' } }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0a0e17;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(29, 78, 216, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 50% 50%, rgba(6, 182, 212, 0.05) 0%, transparent 30%);
            position: relative;
            overflow-x: hidden;
        }
        
        .stars {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, transparent),
                radial-gradient(2px 2px at 40px 70px, #fff, transparent),
                radial-gradient(1px 1px at 90px 40px, #ddd, transparent),
                radial-gradient(1px 1px at 130px 80px, #fff, transparent);
            background-repeat: repeat; background-size: 200px 200px; animation: stars 100s linear infinite;
        }
        
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px) saturate(180%); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); }
        .gradient-text { background: linear-gradient(135deg, #00d4ff 0%, #9d4edd 50%, #ff2e63 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; background-size: 200% auto; animation: shimmer 3s infinite linear; }
        .btn-gradient { background: linear-gradient(135deg, #00d4ff 0%, #9d4edd 100%); transition: all 0.3s ease; }
        .btn-gradient:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(0, 212, 255, 0.4); }
        
        /* Parameter Input Style */
        .param-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 8px 12px;
            color: #fff;
            font-size: 0.8rem;
            width: 100%;
            margin-bottom: 8px;
            outline: none;
            transition: 0.3s;
        }
        .param-input:focus { border-color: #00d4ff; background: rgba(255, 255, 255, 0.1); }

        .api-card { transition: all 0.3s ease; border: 1px solid rgba(255, 255, 255, 0.05); }
        .api-card:hover { transform: translateY(-4px); border-color: rgba(0, 212, 255, 0.3); }

        .loader { width: 28px; height: 28px; border: 2px solid rgba(0, 212, 255, 0.2); border-top: 2px solid #00d4ff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Toast Style */
        #toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #1e253a; color: white; padding: 10px 20px; border-radius: 30px;
            border: 1px solid #00d4ff; z-index: 9999; display: none;
        }

        .contact-customer { position: fixed; bottom: 25px; right: 25px; width: 55px; height: 55px; border-radius: 50%; background: linear-gradient(135deg, #00d4ff 0%, #9d4edd 100%); display: flex; align-items: center; justify-content: center; z-index: 45; cursor: pointer; animation: float 6s ease-in-out infinite; }
    </style>
</head>
<body class="text-slate-300 antialiased font-sans min-h-screen">
    <div class="stars"></div>
    <div id="toast">Endpoint Copied!</div>

    <div id="loadingScreen" class="fixed inset-0 bg-cosmic-primary flex items-center justify-center z-50">
        <div class="text-center">
            <div class="loader mx-auto mb-6"></div>
            <h2 class="text-xl font-bold gradient-text mb-2">Kynas API</h2>
            <p class="text-slate-400 text-sm">Loading cosmic interface...</p>
        </div>
    </div>

    <main class="max-w-6xl mx-auto px-4 md:px-6 py-8 md:py-12">
        <div class="text-center mb-10 md:mb-14">
            <div class="flex flex-col items-center gap-4 mb-6">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-cyan-500 to-purple-600 flex items-center justify-center shadow-2xl pulse-glow">
                    <i class="fas fa-rocket text-white text-2xl"></i>
                </div>
                <div>
                    <h1 id="titleApi" class="text-4xl md:text-5xl font-bold gradient-text mb-2">Kynas API</h1>
                    <p id="descApi" class="text-slate-400 text-base md:text-lg max-w-2xl mx-auto">Welcome to Kynas API documentation.</p>
                </div>
            </div>
            
            <div class="flex flex-wrap justify-center gap-4 mb-8">
                <div class="glass px-5 py-3 rounded-2xl flex items-center gap-3">
                    <i class="fas fa-bolt text-cyan-400"></i>
                    <div><div class="text-2xl font-bold text-white">1,500+</div><div class="text-xs text-slate-400">Active Users</div></div>
                </div>
                <div class="glass px-5 py-3 rounded-2xl flex items-center gap-3">
                    <i class="fas fa-code text-purple-400"></i>
                    <div><div id="endpointCount" class="text-2xl font-bold text-white">0</div><div class="text-xs text-slate-400">Endpoints</div></div>
                </div>
            </div>
        </div>
        
        <div class="glass rounded-2xl p-1 mb-8">
            <div class="relative flex items-center">
                <i class="fas fa-search absolute left-5 text-slate-500"></i>
                <input type="text" id="searchInput" placeholder="Search API endpoints..." class="w-full pl-12 pr-5 py-4 bg-transparent text-slate-300 focus:outline-none">
            </div>
        </div>

        <div class="mb-8">
            <div id="categoryTabs" class="flex flex-wrap gap-2 md:gap-3">
                <button onclick="filterCategory('All')" class="px-5 py-2 rounded-xl glass hover:bg-white/10 transition text-sm font-medium">All</button>
            </div>
        </div>

        <div id="apiList" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            </div>

        <a id="contactCustomerBtn" href="#" target="_blank" class="contact-customer">
            <i class="fab fa-whatsapp text-white text-2xl"></i>
        </a>
        
        <footer class="mt-16 pt-8 border-t border-slate-800 text-center text-slate-400">
            <p id="footer" class="text-base mb-4">© 2024 Kynas API • Cosmic Edition</p>
            <div class="flex justify-center gap-6 text-xl">
                <a id="telegramLink" target="_blank" class="hover:text-cyan-400"><i class="fab fa-telegram"></i></a>
                <a id="whatsappLink" target="_blank" class="hover:text-green-400"><i class="fab fa-whatsapp"></i></a>
            </div>
        </footer>
    </main>
    
    <script>
        let allEndpoints = [];

        async function fetchSettings() {
            try {
                const response = await fetch('/settings');
                const data = await response.json();
                
                document.getElementById('titleApi').innerText = data.name;
                document.getElementById('descApi').innerText = data.description;
                document.getElementById('telegramLink').href = data.linkTelegram;
                document.getElementById('whatsappLink').href = data.linkWhatsapp;
                document.getElementById('contactCustomerBtn').href = data.linkWhatsapp;
                document.getElementById('footer').innerText = `© 2024 ${data.apiSettings.creator} • Kynas API`;

                let count = 0;
                data.categories.forEach(cat => {
                    const tab = document.createElement('button');
                    tab.className = "px-5 py-2 rounded-xl glass hover:bg-white/10 transition text-sm font-medium";
                    tab.innerText = cat.name;
                    tab.onclick = () => filterCategory(cat.name);
                    document.getElementById('categoryTabs').appendChild(tab);

                    cat.items.forEach(item => {
                        allEndpoints.push({ ...item, category: cat.name });
                        count++;
                    });
                });

                document.getElementById('endpointCount').innerText = count;
                renderEndpoints(allEndpoints);
                document.getElementById('loadingScreen').classList.add('hidden');
            } catch (e) { console.log(e); }
        }

        function renderEndpoints(endpoints) {
            const container = document.getElementById('apiList');
            container.innerHTML = '';

            endpoints.forEach(item => {
                const card = document.createElement('div');
                card.className = "api-card glass p-6 rounded-2xl flex flex-col gap-4";
                
                // Cek jika ada innerDesc (parameter)
                let inputsHtml = '';
                if (item.innerDesc) {
                    const params = item.innerDesc.split(',').map(p => p.trim());
                    params.forEach(p => {
                        inputsHtml += `<input type="text" placeholder="Masukkan ${p}" class="param-input" data-param="${p}">`;
                    });
                }

                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <span class="px-2 py-1 text-xxs bg-cyan-500/20 text-cyan-400 rounded-md font-bold uppercase tracking-wider">${item.category}</span>
                        <div class="flex gap-2">
                             <button onclick="copyPath('${item.path}')" class="text-slate-500 hover:text-white"><i class="far fa-copy"></i></button>
                             <span class="text-xs text-slate-500 font-mono">GET</span>
                        </div>
                    </div>
                    <div>
                        <h3 class="text-white font-bold text-lg">${item.name}</h3>
                        <p class="text-slate-400 text-sm mt-1">${item.desc}</p>
                    </div>
                    <div class="api-params-area">
                        ${inputsHtml}
                    </div>
                    <button onclick="executeApi(this, '${item.path}')" class="btn-gradient w-full py-3 text-white rounded-xl font-bold text-sm shadow-lg">
                        TRY ENDPOINT
                    </button>
                `;
                container.appendChild(card);
            });
        }

        function executeApi(btn, path) {
            const card = btn.closest('.api-card');
            const inputs = card.querySelectorAll('.param-input');
            let url = new URL(window.location.origin + path);

            inputs.forEach(input => {
                const key = input.getAttribute('data-param');
                const val = input.value;
                if (val) url.searchParams.append(key, val);
            });

            window.open(url.toString(), '_blank');
        }

        function copyPath(path) {
            const fullUrl = window.location.origin + path;
            navigator.clipboard.writeText(fullUrl);
            const t = document.getElementById('toast');
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2000);
        }

        function filterCategory(catName) {
            if (catName === 'All') renderEndpoints(allEndpoints);
            else renderEndpoints(allEndpoints.filter(i => i.category === catName));
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            renderEndpoints(allEndpoints.filter(i => i.name.toLowerCase().includes(val)));
        });

        window.onload = fetchSettings;
    </script>
</body>
</html>
